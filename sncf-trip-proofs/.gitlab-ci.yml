stages:
  - test

# Image complète et non -slim : les tests du wrapper exécutent le script bash du
# README, qui appelle shasum — absent de python:3.12-slim, où ils seraient
# silencieusement skippés.
tests:
  stage: test
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .pip-cache
  before_script:
    - pip install --quiet --root-user-action=ignore -r requirements.txt pytest
  script:
    - python -m pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
