# tmux-agnostic-setup — managed file. Edit it in the repo; this path is a symlink.

# --- Plugins --------------------------------------------------------------
# TPM defaults its install path to <dir of tmux.conf>/plugins as soon as an XDG
# tmux.conf exists. Pin it explicitly: a mismatch here loads no plugin at all,
# silently, and takes save/restore down with it.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# --- Save / restore -------------------------------------------------------
# Saving is driven from here rather than tmux-continuum: continuum disables its
# own auto-save whenever it counts more than one `tmux` process at server start
# (which our own wrapper scripts trigger), and ships a macOS-only launchd plist.
# These hooks fire on the transitions that actually matter and are identical on
# every platform.
# No hook on session-closed: it fires while the server is tearing down, and the
# snapshot it produces is missing the very sessions worth restoring.
set-hook -g client-detached 'run-shell -b "~/.config/tmux/proj.sh --save"'
set-hook -g window-linked   'run-shell -b "~/.config/tmux/proj.sh --save"'
set-hook -g window-unlinked 'run-shell -b "~/.config/tmux/proj.sh --save"'

bind C-s run-shell -b "~/.config/tmux/proj.sh --save -n"
bind C-r run-shell -b "~/.config/tmux/proj.sh --restore -n"

# --- Behaviour ------------------------------------------------------------
set -g mouse on
set -g set-clipboard on
set -g monitor-activity on
set -g visual-activity off
set -g automatic-rename on

# Copy to the system clipboard on mouse release, per platform.
if-shell 'command -v pbcopy >/dev/null' \
    'bind -T copy-mode   MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy" ; \
     bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"'
if-shell 'command -v wl-copy >/dev/null' \
    'bind -T copy-mode   MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy" ; \
     bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"'
if-shell 'command -v xclip >/dev/null && ! command -v wl-copy >/dev/null && ! command -v pbcopy >/dev/null' \
    'bind -T copy-mode   MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard" ; \
     bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"'

# --- Appearance -----------------------------------------------------------
set -g pane-border-lines heavy
set -g pane-active-border-style 'fg=#FF87AF'
set -g pane-border-style 'fg=colour238'

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 120
set -g status-left " #S #[fg=colour241]#I:#P "
set -g status-right "#(~/.config/tmux/statusbar.sh #{pane_current_path})  #[fg=colour241]%H:%M %d-%b-%Y "

# --- Keybindings ----------------------------------------------------------
bind -n S-Left  select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up    select-pane -U
bind -n S-Down  select-pane -D

bind g switch-client -T g-table
bind -T g-table g select-layout tiled
bind -T g-table + resize-pane -R 5 \; resize-pane -D 5
bind -T g-table - resize-pane -L 5 \; resize-pane -U 5

run '~/.config/tmux/plugins/tpm/tpm'
