name: sncf-trip-proofs — tests

on:
  push:
    paths:
      - 'sncf-trip-proofs/**'
      - '.github/workflows/sncf-trip-proofs-tests.yml'
  pull_request:
    paths:
      - 'sncf-trip-proofs/**'
      - '.github/workflows/sncf-trip-proofs-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sncf-trip-proofs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
